function navButton(x,short){return '<button class="'+(x[0]==cur?'on':'')+'" onclick="go(\''+x[0]+'\')"><span class="ico">'+x[2]+'</span>'+x[1]+'</button>'}
function render(){renderNotify();var m=mods.find(function(x){return x[0]==cur});$('#title').textContent=m[1];$('#crumb').textContent=m[1];$('#desc').textContent=m[3];$('#today').textContent=fmt(iso());$('#nav').innerHTML=mods.map(function(x){return navButton(x,0)}).join('');$('#bottomNav').innerHTML='';var labels={inicio:'Crear',ingresos:'Nuevo ingreso',gastos:'Nuevo gasto',deudas:'Nueva deuda',vehiculos:'Nuevo vehiculo',conductores:'Nuevo conductor',documentos:'Nuevo documento',reportes:'Exportar resumen',config:'Guardar cambios'};var pb=$('#primary');pb.textContent=labels[cur];pb.style.display=cur=='inicio'?'none':'inline-flex';pb.onclick=primary;var fab=$('#fab');fab.style.display=(cur=='reportes'||cur=='config')?'none':'block';initUX();if(cur=='inicio')home();else if(cur=='reportes')reports();else if(cur=='config')config();else crud(cur)}
function initUX(){var sy=$('#sync');if(sy&&!sy.ready){sy.ready=1;sy.onclick=syncNow}var st=$('#sideToggle');if(st&&!st.ready){st.ready=1;st.onclick=function(){var s=$('#shell');s.classList.toggle('collapsed');st.textContent=s.classList.contains('collapsed')?'›':'‹'}}var gs=$('#globalSearch');if(gs&&!gs.ready){gs.ready=1;gs.oninput=function(){globalSearch(this.value)};gs.onfocus=function(){globalSearch(this.value)}}var fab=$('#fab');if(fab&&!fab.ready){fab.ready=1;fab.onclick=fabAction}var mb=$('#menuBtn');if(mb&&!mb.ready){mb.ready=1;mb.onclick=openDrawer}}
function primary(){if(cur=='inicio')quickCreate();else if(cur=='reportes')exportCsv();else if(cur=='config')saveConfig();else openForm(cur)}
function fabAction(){if(cur=='inicio')quickCreate();else if(!['reportes','config'].includes(cur))openForm(cur)}
function globalSearch(q){var box=$('#searchResults');q=(q||'').trim().toLowerCase();if(!q){box.classList.remove('open');box.innerHTML='';return}var out=[];state.vehicles.forEach(function(v){out.push({t:'Vehiculo '+v.plate,s:v.brand+' '+v.model,m:'vehiculos'})});state.drivers.forEach(function(d){out.push({t:d.name,s:'Conductor '+d.id,m:'conductores'})});state.docs.forEach(function(d){out.push({t:d.type+' '+d.plate,s:'Documento vence '+fmt(d.expires),m:'documentos'})});state.debts.forEach(function(d){var x=debtTotal(d.id);if(x.bal>0)out.push({t:'Deuda '+d.plate,s:money.format(x.bal)+' pendiente',m:'deudas'})});out=out.filter(function(x){return (x.t+' '+x.s).toLowerCase().includes(q)}).slice(0,6);box.innerHTML=out.length?out.map(function(x){return '<button class="searchItem" onclick="selectSearch(\''+x.m+'\')"><strong>'+x.t+'</strong><small>'+x.s+'</small></button>'}).join(''):'<div class="empty">Sin resultados.</div>';box.classList.add('open')}
function selectSearch(m){$('#globalSearch').value='';$('#searchResults').classList.remove('open');go(m)}
function openDrawer(){var sh=$('#shell'),s=$('.side'),b=$('#drawerBackdrop');if(sh)sh.classList.remove('collapsed');if(s)s.classList.add('open');if(b)b.classList.add('open');document.body.classList.add('drawerOpen')}function closeDrawer(){var s=$('.side'),b=$('#drawerBackdrop');if(s)s.classList.remove('open');if(b)b.classList.remove('open');document.body.classList.remove('drawerOpen')}document.addEventListener('keydown',function(e){if(e.key=='Escape')closeDrawer()});function quickCreate(){var items=[['ingresos','Ingreso'],['gastos','Gasto'],['deudas','Deuda'],['vehiculos','Vehiculo'],['conductores','Conductor'],['documentos','Documento']];$('#modal').className='modalRoot open sheetModal';$('#modal').innerHTML='<div class="sheet"><div class="modalHead"><h2>Crear registro</h2><button class="icon" onclick="closeM()">x</button></div><div class="quickGrid">'+items.map(function(i){return '<button class="ghost" onclick="closeM();go(\''+i[0]+'\');setTimeout(function(){openForm(\''+i[0]+'\')},120)">'+i[1]+'</button>'}).join('')+'</div></div>'}
function chips(t){var a=[];if(filters.q)a.push(['q','Busqueda: '+filters.q]);if(filters.status)a.push(['status','Estado: '+filters.status]);return a.length?'<div class="chipRow">'+a.map(function(c){return '<button class="chip" onclick="delete filters.'+c[0]+';crud(\''+t+'\')">'+c[1]+' x</button>'}).join('')+'</div>':''}
function crud(t){var f=filter(rows(t)),s=statuses(t),statusField=s.length?'<label class="field filter"><span>Estado</span><select onchange="filters.status=this.value;crud(\''+t+'\')"><option value="">Todos</option>'+s.map(function(x){return '<option '+(filters.status==x?'selected':'')+'>'+x+'</option>'}).join('')+'</select></label>':'';$('#view').innerHTML='<section class="panel"><div class="filters"><button class="ghost filterMobile" onclick="openFilters(\''+t+'\')">Filtros</button><label class="field filter"><span>Buscar</span><input value="'+(filters.q||'')+'" oninput="filters.q=this.value;crud(\''+t+'\')" placeholder="Texto, placa, conductor..."></label>'+statusField+'<button class="ghost clearFilters" onclick="filters={};crud(\''+t+'\')">Limpiar filtros</button></div>'+chips(t)+table(t,f)+'</section>'}
function openFilters(t){var s=statuses(t),statusField=s.length?'<label class="field full"><span>Estado</span><select name="status"><option value="">Todos</option>'+s.map(function(x){return '<option '+(filters.status==x?'selected':'')+'>'+x+'</option>'}).join('')+'</select></label>':'';$('#modal').className='modalRoot open sheetModal';$('#modal').innerHTML='<form class="sheet" id="filterForm"><div class="modalHead"><h2>Filtros</h2><button class="icon" type="button" onclick="closeM()">x</button></div><div class="modalBody"><label class="field full"><span>Buscar</span><input name="q" value="'+(filters.q||'')+'" placeholder="Texto, placa, conductor..."></label>'+statusField+'</div><div class="modalFoot"><button class="ghost" type="button" onclick="filters={};closeM();crud(\''+t+'\')">Limpiar</button><button class="btn">Aplicar</button></div></form>';$('#filterForm').onsubmit=function(e){e.preventDefault();filters=Object.fromEntries(new FormData(e.target).entries());if(!s.length)delete filters.status;closeM();crud(t)}}
function home(){var md=metricData(),alerts=alertItems().length;$('#view').innerHTML='<section class="hero"><div><h2>Control diario de la flota</h2><p>Revisa ingresos, gastos, deudas y documentos por vencer desde un tablero pensado para operar rapido durante el dia.</p><div class="heroStats"><span>'+md[4][1]+' vehiculos activos</span><span>'+md[0][1]+' ingreso diario</span><span>'+alerts+' alertas activas</span></div></div></section><section class="metrics">'+md.map(card).join('')+'</section><section class="panel"><div class="head"><h2>Renta diaria</h2><button class="ghost" onclick="toast(\'Renta diaria actualizada.\')">Actualizar</button></div><div class="quickGrid"><button class="ghost" onclick="openForm(\'ingresos\')">Ingreso</button><button class="ghost" onclick="openForm(\'gastos\')">Gasto</button><button class="ghost" onclick="openForm(\'deudas\')">Deuda</button><button class="ghost" onclick="quickPay()">Abono</button></div>'+table('renta',daily())+'</section>'}
function quickPay(){var d=state.debts.find(function(x){return debtTotal(x.id).bal>0});d?pay(d.id):toast('No hay deudas pendientes.')}
function actions(t,i){if(t=='renta')return'<div class="row"><button onclick="fromDaily(\'ingresos\',\''+i+'\')">Ingreso</button><button onclick="fromDaily(\'gastos\',\''+i+'\')">Gasto</button><button onclick="fromDaily(\'deudas\',\''+i+'\')">Deuda</button><button onclick="payFromDaily(\''+i+'\')">Abono</button></div>';if(t=='deudas')return'<div class="row"><button onclick="openForm(\''+t+'\',\''+i+'\')">Editar</button><button onclick="pay(\''+i+'\')">Abono</button></div>';if(t=='vehiculos')return'<div class="row"><button onclick="openForm(\''+t+'\',\''+i+'\')">Editar</button><button onclick="finance(\''+i+'\')">Ficha</button></div>';return'<div class="row"><button onclick="openForm(\''+t+'\',\''+i+'\')">Editar</button><button onclick="del(\''+t+'\',\''+i+'\')">Eliminar</button></div>'}
function payFromDaily(i){var p=i.split('|')[1],d=state.debts.find(function(x){return x.plate==p&&debtTotal(x.id).bal>0});d?pay(d.id):toast('Este vehiculo no tiene deudas pendientes.')}
var vehTab='resumen';function finance(p){var v=veh(p),inc=sum(state.incomes.filter(function(i){return i.plate==p}),'value'),exp=sum(state.expenses.filter(function(e){return e.plate==p}),'value'),deb=state.debts.filter(function(d){return d.plate==p}).reduce(function(s,d){return s+debtTotal(d.id).bal},0),tabs=[['resumen','Resumen'],['timeline','Timeline'],['docs','Documentos'],['datos','Datos']];$('#modal').className='modalRoot open';$('#modal').innerHTML='<div class="modal"><div class="modalHead"><h2>Ficha '+p+'</h2><button class="icon" onclick="closeM()">x</button></div><div class="tabs vehicleTabs">'+tabs.map(function(t){return '<button class="tab '+(vehTab==t[0]?'on':'')+'" onclick="vehTab=\''+t[0]+'\';finance(\''+p+'\')">'+t[1]+'</button>'}).join('')+'</div><div class="modalBody">'+vehiclePanel(p,vehTab,inc,exp,deb,v)+'</div><div class="modalFoot"><button class="btn" onclick="closeM()">Cerrar</button></div></div>'}
function vehiclePanel(p,mode,inc,exp,deb,v){if(mode=='timeline')return '<div class="timeline">'+vehicleEvents(p).map(function(e){return '<div class="event"><time>'+fmt(e.date)+'</time><div><strong>'+e.t+'</strong><p>'+e.d+'</p></div></div>'}).join('')+'</div>';if(mode=='docs')return table('reportes',state.docs.filter(function(d){return d.plate==p}).map(function(d){var s=docStatus(d.expires);return{id:d.id,tipo:d.type,numero:d.number,vencimiento:fmt(d.expires),estado:s[0]}}));if(mode=='datos')return fieldView([['Placa',p],['Marca',v.brand],['Modelo',v.model],['Año',v.year],['Color',v.color||'Sin dato'],['Conductor',((drvPlate(p)||{}).name||'Sin asignar')],['Estado',v.status]]);return '<div class="metric"><span>Vehiculo</span><strong>'+v.brand+' '+v.model+'</strong></div><div class="metric"><span>Conductor</span><strong>'+((drvPlate(p)||{}).name||'Sin asignar')+'</strong></div>'+[['Ingresos historicos',money.format(inc)],['Gastos historicos',money.format(exp)],['Deudas pendientes',money.format(deb)],['Resultado',money.format(inc-exp-deb)]].map(card).join('')}
function fieldView(a){return a.map(function(x){return '<div class="metric"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>'}).join('')}
function vehicleEvents(p){var e=[];state.incomes.filter(function(x){return x.plate==p}).forEach(function(x){e.push({date:x.date,t:'Ingreso',d:money.format(x.value)+' por '+x.method})});state.expenses.filter(function(x){return x.plate==p}).forEach(function(x){e.push({date:x.date,t:'Gasto',d:x.cat+' - '+money.format(x.value)})});state.debts.filter(function(x){return x.plate==p}).forEach(function(x){e.push({date:x.date,t:'Deuda',d:x.concept+' - saldo '+money.format(debtTotal(x.id).bal)})});state.docs.filter(function(x){return x.plate==p}).forEach(function(x){e.push({date:x.expires,t:'Documento',d:x.type+' vence este dia'})});state.pays.forEach(function(a){var d=state.debts.find(function(x){return x.id==a.debt&&x.plate==p});if(d)e.push({date:a.date,t:'Abono',d:money.format(a.value)+' a '+d.concept})});return e.sort(function(a,b){return b.date.localeCompare(a.date)})}
function closeM(){$('#modal').className='modalRoot';$('#modal').innerHTML=''}

function apiUrl(action){var sep=API_ENDPOINT.indexOf('?')>-1?'&':'?';return API_ENDPOINT+sep+'action='+encodeURIComponent(action)+'&cache='+Date.now()}
async function loadFromCsv(){var db={settings:{},vehicles:[],drivers:[],incomes:[],expenses:[],debts:[],pays:[],docs:[]};for(var i=0;i<SHEET_TABS.length;i++){var tab=SHEET_TABS[i],res=await fetch(sheetUrl(tab));if(!res.ok)throw new Error(tab+' '+res.status);var data=rowsToObjects(csvRows(await res.text()));if(tab=='settings')data.forEach(function(r){if(r.key)db.settings[r.key]=r.value});else db[tab]=data}return db}
async function loadSheetDB(){toast('Sincronizando libro...');var db;if(API_ENDPOINT){var res=await fetch(apiUrl('read'));if(!res.ok)throw new Error('api '+res.status);var json=await res.json();if(!json.ok)throw new Error(json.error||'api');db=json.data||{}}else{db=await loadFromCsv()}state=cleanState(db);state.settings.apiUrl=API_ENDPOINT;state.source={spreadsheetId:SHEET_ID,syncedAt:new Date().toISOString()};save();render();toast('Libro sincronizado.')}
async function pushSheetChange(kind,row){var endpoint=API_ENDPOINT||WRITE_ENDPOINT;if(!endpoint)return false;await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({kind:kind,row:row})});return true}
async function syncNow(){try{if(!API_ENDPOINT)toast('Pega la URL de Apps Script en Configuracion.');await loadSheetDB()}catch(e){toast(API_ENDPOINT?'No se pudo sincronizar el backend.':'No se pudo leer el libro. Falta conectar Apps Script.');console.error(e)}}
function config(){$('#view').innerHTML='<section class="panel"><div class="head"><h2>Parametros generales</h2></div><div class="modalBody"><label class="field"><span>Dias de alerta documental</span><input id="alertDays" type="number" value="'+state.settings.alertDays+'"></label><label class="field"><span>Usuario por defecto</span><input id="user" value="'+state.settings.user+'"></label><label class="field full"><span>Backend de Google Sheets</span><input value="Conectado al libro REENTRY APP" disabled></label></div></section>'}
function saveConfig(){state.settings.alertDays=val($('#alertDays').value)||30;state.settings.user=$('#user').value||'Admin local';API_ENDPOINT=DEFAULT_API_ENDPOINT;WRITE_ENDPOINT=DEFAULT_API_ENDPOINT;state.settings.apiUrl=DEFAULT_API_ENDPOINT;localStorage.setItem(API_KEY,DEFAULT_API_ENDPOINT);save();pushSheetChange('settings',state.settings).then(function(ok){toast(ok?'Configuracion global guardada.':'Configuracion guardada localmente.');render()}).catch(function(){toast('Configuracion local; pendiente sincronizar.')})}
$('#reset').onclick=function(){syncNow()};render();syncNow();
</script>
</body>
</html>
